[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "exlightnet-reproduction"
version = "0.1.0"
description = "Evidence-based CPU reproduction of ExLightNet"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-package.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
exlightnet = "exlightnet.run_all:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
